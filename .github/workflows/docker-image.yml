name: Docker Build -> Push -> Deploy

on:
  push:
    branches: [ "main" ]

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v7

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
      
    - name: Build Jar
      run: ./mvnw clean package -DskipTest

    - name: Login to Dockerhub
      run: docker login -u "${{secrets.DOCKER_USERNAME}}" --password-stdin
      
    - name: Build Docker image
      run: docker build -t ${{ secrets..DOCKER_USERNAME }}/spring-boot-ci-demo:latest
      
    - name: push image to dockerhub
      run: docker push ${{ secrets..DOCKER_USERNAME }}/spring-boot-ci-demo:latest
    
    - name: ssh and deploy to EC2
      uses: appleboy/ssh-action@v1
      with:
        host: "foo.com:1234,bar.com:5678"
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          docker stop spring-demo || true
          docker rm spring-demo || true
          docker pull ${{ secrets..DOCKER_USERNAME }}/spring-boot-ci-demo:latest
          docker run -d --name spring-demo -p 8080:8080 ${{ secrets..DOCKER_USERNAME }}/spring-boot-ci-demo:latest
          ls -al

    
